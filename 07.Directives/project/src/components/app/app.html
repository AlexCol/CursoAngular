  <!-- <ng-template appAuth="admin">

  <!-- caso não se deseje usar o ng-template, pode-se usar a diretiva estrutural *appAuth -->
  <p *appAuth="'admin'" class="protected-content admin">Only admin can see this</p>
  <p *appAuth="'user'" class="protected-content authenticated">Regular users can see this</p>
  <p *appAuth="'guest'" class="protected-content unauthenticated">Only guests can see this</p>
