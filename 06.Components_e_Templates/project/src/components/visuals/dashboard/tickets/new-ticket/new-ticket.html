<form [class]="styles.newTicket">
  <app-control label="Title">
    <input [class]="styles.input" id="title" />
  </app-control>

  <app-control label="Request">
    <textarea [class]="styles.input" id="request" rows="3"></textarea>
  </app-control>

  <p>
    <button appButton>
      Submit
      <span ngProjectAs="[icon]">⌲</span>
    </button>
  </p>
</form>
