<form [class]="styles.newTicket">
  <p>
    <label for="title" [class]="styles.newTicketLabel">Title</label>
    <input [class]="styles.input" name="title" id="title" />
  </p>
  <p>
    <label for="request" [class]="styles.newTicketLabel">Request</label>
    <textarea [class]="styles.input" name="request" id="request" rows="3"></textarea>
  </p>
  <p>
    <button [class]="styles.button">
      <span> Submit </span>
      <span [class]="styles.icon"> ⌲ </span>
    </button>
  </p>
</form>
