<!-- pra uso do form capturado pelo @ViewChild -->
<form [class]="styles.newTicket" (ngSubmit)="onSubmit4()" #form>
  <app-control label="Title">
    <input [class]="styles.input" id="title" name="title" [(ngModel)]="enteredTitle" />
  </app-control>

  <app-control label="Request">
    <textarea [class]="styles.input" id="request" name="request" [(ngModel)]="enteredText" rows="3"></textarea>
  </app-control>

  <p>
    <button appButton>
      Submit
      <span ngProjectAs="[icon]">⌲</span>
    </button>
  </p>
</form>
